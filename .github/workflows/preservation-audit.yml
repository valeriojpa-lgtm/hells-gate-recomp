name: Preservation static audit

on:
  push:
    branches: [preservation-autofix]
  pull_request:

jobs:
  preservation-source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile preservation Python
        run: |
          python -m py_compile \
            tools/portable_builder/prepare_variant_manifest.py \
            tools/portable_builder/preservation_audit.py \
            tools/portable_builder/analyze_run_log.py \
            tools/portable_builder/compare_run_reports.py \
            tools/portable_builder/detect_disc_languages.py \
            tools/portable_builder/verify_patched_sdk.py \
            tools/portable_builder/test_preservation_tools.py \
            patches/generated/apply_generated_patches.py
      - name: Test preservation tools
        run: python -m unittest tools/portable_builder/test_preservation_tools.py -v
      - name: Parse portable builder PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/portable_builder/Build-DantePortable.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Verify SDK patch and preservation invariants on pristine ReXGlue v0.10.0
        shell: bash
        run: |
          git clone --branch v0.10.0 --depth 1 https://github.com/rexglue/rexglue-sdk.git /tmp/rexglue-sdk
          PATCH="$GITHUB_WORKSPACE/patches/sdk/rexglue-sdk-v0.10.0.patch"
          git -C /tmp/rexglue-sdk apply --check "$PATCH"
          git -C /tmp/rexglue-sdk apply "$PATCH"
          python tools/portable_builder/verify_patched_sdk.py /tmp/rexglue-sdk
      - name: Validate source-only preservation invariants
        run: |
          python tools/portable_builder/preservation_audit.py \
            --mode source \
            --json preservation-static.json \
            --markdown preservation-static.md
      - uses: actions/upload-artifact@v4
        with:
          name: preservation-static-audit
          path: |
            preservation-static.json
            preservation-static.md
